  services:
    backend:
      build:
        context: ./api
        args:
          API_PORT: ${API_PORT}                                                                                                                             
      container_name: api
      env_file:
        - .env
      networks:
        - chatbot_net
      depends_on:
        - redis
      environment:
        - REDIS_HOST=redis
        - REDIS_PORT=${REDIS_PORT}                                                                                                                          
      
    chatbot:
      build:
        context: ./chatbot                                                                                                                                  
        args:
          CHATBOT_PORT: ${CHATBOT_PORT}
      container_name: chatbot
      env_file:
        - .env
      networks:
        - chatbot_net
      environment:
        - CHAINLIT_HOST=0.0.0.0
        - CHAINLIT_PORT=${CHATBOT_PORT}
        - API_HOST=api
        - API_PORT=${API_PORT}
        - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}

    frontend:
      build:
        context: .                                                                                                                                          
        args:
          VUE_APP_CESIUM_TOKEN: ${VUE_APP_CESIUM_TOKEN}
          VUE_APP_CESIUM_RESOURCE_ID: ${VUE_APP_CESIUM_RESOURCE_ID}
          VUE_APP_GOOGLE_MAPS_KEY: ${VUE_APP_GOOGLE_MAPS_KEY}
          VUE_APP_MAPTILER_KEY: ${VUE_APP_MAPTILER_KEY}
      container_name: ui
      ports:
        - "80:80"
        - "443:443"                                                                                                                                         
      volumes:
        - /etc/letsencrypt:/etc/letsencrypt:ro   
      networks:
        - chatbot_net
      environment: 
        - API_PORT=${API_PORT}
        - CHATBOT_PORT=${CHATBOT_PORT}
      depends_on:
        - backend
        - chatbot
      
    redis:
      image: redis:7-alpine
      container_name: redis                                                                                                                                 
      networks:
        - chatbot_net
      volumes:
        - redis_data:/data
      command: ["redis-server", "--port", "${REDIS_PORT}", "--appendonly", "yes", "--protected-mode", "yes", "--requirepass", "${REDIS_PASSWORD}"]

  networks:
    chatbot_net:
      driver: bridge                                                                                                                                        

  volumes:
    redis_data: